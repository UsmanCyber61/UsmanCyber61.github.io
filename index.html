<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UsmanCyber61 | Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #161b22;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            border: 1px solid #30363d;
            max-width: 400px;
            width: 100%;
        }
        h1 { color: #58a6ff; margin-bottom: 5px; }
        p { color: #8b949e; margin-bottom: 25px; }
        .links a {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px;
            margin: 10px 0;
            background-color: #21262d;
            color: #c9d1d9;
            text-decoration: none;
            border-radius: 6px;
            border: 1px solid #30363d;
            font-weight: bold;
            transition: 0.2s;
        }
        .links a:hover {
            background-color: #30363d;
            color: #58a6ff;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Usman Qadeer</h1>
        <p>Cyber Security Student</p>
        <div class="links">
            <a href="https://github.com/UsmanCyber61" target="_blank">
                <i class="fab fa-github"></i> GitHub Profile
            </a>
            <a href="https://linkedin.com/in/usman-qadeer-54a2495b2" target="_blank">
                <i class="fab fa-linkedin"></i> LinkedIn Profile
            </a>
        </div>
    </div>
</body>
</html>
